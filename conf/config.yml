# ---------------------------------------------------------------------------
# CFO Data Platform PoC — central configuration
# Read by every notebook via dbutils.widgets defaults / the databricks.yml bundle.
# Change `catalog` per environment (dev / test / prod) to isolate the deployment.
# ---------------------------------------------------------------------------

catalog: cfo_poc

# Medallion + hub-and-spoke schemas (one Unity Catalog schema per architecture zone)
schemas:
  lz_raw:        lz_raw          # Raw Data (Landing Zone)  -> Bronze
  oz_organized:  oz_organized    # Organized Zone           -> Silver (conformed)
  hub:           hub             # HUB Primary: master data, party profiles, KYC
  underwriting:  underwriting    # Spoke: Risk, Quotes
  policy:        policy          # Spoke: Policies, Fees
  claims:        claims          # Spoke: FNOL, Claims
  efr:           efr             # Enterprise Finance Reporting (GL, FAH-Detail) — Semantic Zone
  reporting:     reporting       # CFO Reporting marts (Gold serving views)
  abc_control:   abc_control     # Audit, Balance & Control framework + Silver DQ results

# Audit, Balance & Control (ABC) — Source -> Raw ingestion reconciliation, and
# the Silver Data Quality (DQ) engine. See src/_abc.py and src/_dq.py.
controls:
  # Relative tolerance for the numeric control-total balance (source vs raw).
  # Bronze ingestion is lossless (read -> write, no filtering), so default = exact.
  control_total_tolerance: 0.0
  # Route Silver rows failing a HIGH-severity DQ rule to <entity>_dq_quarantine
  # (kept out of the conformed table) instead of only flagging them in place.
  quarantine_dq_failures: true
  # AI-powered Silver DQ (src/_dq_ai.py): semantic / contextual checks via
  # Databricks AI Functions (ai_query with structured output). Advisory only —
  # results are flagged + logged, never quarantined. Sampled and non-fatal, so it
  # cannot fail the run or run away on cost. Requires Foundation Model API access.
  # NOTE: the EFFECTIVE values are AI_DQ_ENABLED / AI_DQ_MODEL / AI_DQ_SAMPLE_ROWS
  # in src/_common.py; this block mirrors them (only `catalog` is wired via widgets).
  ai_dq:
    enabled: true
    model_endpoint: databricks-meta-llama-3-3-70b-instruct  # any Serving/FM endpoint or system.ai.*
    sample_rows: 200                                        # rows sent to the model per check

# Volume that simulates the source-system landing area (files dropped by extracts)
landing_volume: landing

# Synthetic data scale (rows). Tune down for a fast smoke test, up for scale demos.
scale:
  parties:        5000
  producers:       400
  quotes:        12000
  policies:       8000
  policy_fees:   16000
  claims:         6000
  reinsurance:     600
  headcount:      1200
  seed:             42

# Governance: principals that are allowed to see unmasked PII / KYC.
# Replace with the real Unity Catalog groups in the customer workspace.
governance:
  pii_reader_group:  cfo_pii_readers
  kyc_reader_group:  cfo_kyc_readers
