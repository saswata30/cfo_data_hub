# ===========================================================================
# CFO Data Platform PoC — Databricks Asset Bundle
#
# Implements the "CFO Data Architecture": Sources -> Raw (LZ) -> Data Lake
# (Organized + Semantic zones, Hub & Spoke data mesh, EFR) -> CFO Reporting,
# governed end-to-end by Unity Catalog.
#
# Controls: Source->Raw ingestion is wrapped by the Audit, Balance & Control
# (ABC) framework (task landing_zone_bronze); the Silver conform step runs the
# declarative Data Quality (DQ) engine (task organized_zone_silver). Both log to
# the abc_control schema. See src/_abc.py and src/_dq.py.
#
# Late-arriving claims: the standalone job cfo_late_arriving_claims_scenario posts
# late claim facts into EFR as delta journals (prior-period adjustments for closed
# periods) and restates the origin-period view. See src/11_late_arriving_claims.py.
#
# Deploy:   databricks bundle deploy   -t dev --var warehouse_id=<sql-warehouse-id>
# Run:      databricks bundle run cfo_data_platform_pipeline -t dev
#           databricks bundle run cfo_late_arriving_claims_scenario -t dev
# ===========================================================================
bundle:
  name: cfo_data_platform

variables:
  catalog:
    description: Unity Catalog catalog for this deployment (isolates dev/test/prod).
    default: cfo_poc
  warehouse_id:
    description: SQL warehouse that serves the EFR dashboard.

# All pipeline tasks run on Serverless Jobs compute — no cluster to size.
# (Requires serverless workflows enabled in the target workspace.)
resources:
  jobs:
    cfo_data_platform_pipeline:
      name: "[${bundle.target}] CFO Data Platform — LZ+ABC ▸ OZ+DQ ▸ Hub&Spoke ▸ EFR ▸ Reporting"
      tags:
        project: cfo-data-platform-poc
        owner: saswata30
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: setup_unity_catalog
          notebook_task:
            notebook_path: ./src/00_setup_unity_catalog.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: generate_synthetic_sources
          depends_on: [{ task_key: setup_unity_catalog }]
          notebook_task:
            notebook_path: ./src/01_generate_synthetic_sources.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: landing_zone_bronze
          depends_on: [{ task_key: generate_synthetic_sources }]
          notebook_task:
            notebook_path: ./src/02_landing_zone_bronze.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: organized_zone_silver
          depends_on: [{ task_key: landing_zone_bronze }]
          notebook_task:
            notebook_path: ./src/03_organized_zone_silver.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: hub_master_data
          depends_on: [{ task_key: organized_zone_silver }]
          notebook_task:
            notebook_path: ./src/04_hub_master_data.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: spoke_underwriting
          depends_on: [{ task_key: hub_master_data }]
          notebook_task:
            notebook_path: ./src/05_spoke_underwriting.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: spoke_policy
          depends_on: [{ task_key: hub_master_data }]
          notebook_task:
            notebook_path: ./src/06_spoke_policy.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: spoke_claims
          depends_on: [{ task_key: hub_master_data }]
          notebook_task:
            notebook_path: ./src/07_spoke_claims.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: efr_semantic_gold
          depends_on:
            - { task_key: spoke_underwriting }
            - { task_key: spoke_policy }
            - { task_key: spoke_claims }
          notebook_task:
            notebook_path: ./src/08_efr_semantic_gold.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: reporting_marts
          depends_on: [{ task_key: efr_semantic_gold }]
          notebook_task:
            notebook_path: ./src/09_reporting_marts.py
            base_parameters: { catalog: "${var.catalog}" }

        - task_key: governance_masking
          depends_on: [{ task_key: reporting_marts }]
          notebook_task:
            notebook_path: ./src/10_governance_masking.py
            base_parameters: { catalog: "${var.catalog}" }

    # Standalone scenario: late-arriving claim facts → EFR delta journals.
    # NOT part of the main pipeline (it posts into gold incrementally) — run it on demand,
    # after cfo_data_platform_pipeline has populated the catalog:
    #   databricks bundle run cfo_late_arriving_claims_scenario -t dev
    cfo_late_arriving_claims_scenario:
      name: "[${bundle.target}] CFO Scenario — Late-arriving claims ▸ EFR journals"
      tags:
        project: cfo-data-platform-poc
        owner: saswata30
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: late_arriving_claims
          notebook_task:
            notebook_path: ./src/11_late_arriving_claims.py
            base_parameters:
              catalog: "${var.catalog}"
              n_new_late_claims: "40"
              n_developed_claims: "60"
              booking_date: ""           # blank = today
              close_through_period: ""   # blank = month before booking_date

  # AI/BI dashboard over EFR: booked vs restated P&L, trial balance, late-arrival journals.
  # Regenerate the JSON with `python scripts/build_efr_dashboard.py`.
  dashboards:
    efr_finance_dashboard:
      display_name: "[${bundle.target}] EFR — Enterprise Finance Reporting"
      file_path: ./dashboards/efr_finance.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}

targets:
  dev:
    mode: development
    default: true
    # Workspace comes from your CLI profile (`-p <profile>`) or DATABRICKS_HOST.
    variables:
      catalog: cfo_poc

  prod:
    mode: production
    variables:
      catalog: cfo_prod
